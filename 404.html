<style>
:root {
  --bg: #f6f9fe;
  --bg-2: #eef4fd;
  --ink: #16213a;
  --muted: #56657e;
  --faint: #8695ab;
  --primary: #2b7bf3;
  --primary-soft: rgba(43, 123, 243, .10);
  --accent: #f0663a;
  --glass: rgba(255, 255, 255, .72);
  --glass-2: rgba(255, 255, 255, .94);
  --glass-head: rgba(255, 255, 255, .88);
  --stroke: rgba(27, 52, 92, .10);
  --stroke-2: rgba(27, 52, 92, .16);
  --shadow: 0 12px 32px rgba(26, 48, 84, .07);
  --radius: 18px;
  --font-display: "Nunito", "Noto Sans SC", sans-serif;
  --font-body: "Nunito", "Noto Sans SC", sans-serif;
  --font-mono: "JetBrains Mono", "Noto Sans SC", monospace;
}
[data-theme="dark"] {
  --bg: #0d1524;
  --bg-2: #101a2c;
  --ink: #eef3fb;
  --muted: #a7b6cc;
  --faint: #7d8ea8;
  --primary: #5a9dff;
  --primary-soft: rgba(90, 157, 255, .14);
  --accent: #ff8660;
  --glass: rgba(255, 255, 255, .06);
  --glass-2: rgba(255, 255, 255, .10);

  --stroke: rgba(255, 255, 255, .10);

}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.78;
  letter-spacing: .01em;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); letter-spacing: .01em; }
a { color: inherit; text-decoration: none; }

.bar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px;
  background: var(--glass-head);
  border-bottom: 1px solid var(--stroke);
}
.brand { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.brand .m { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; }
.sp { flex: 1; }
.icon-btn { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--stroke-2); background: var(--glass); color: var(--muted); cursor: pointer; }
.icon-btn:hover { color: var(--ink); border-color: var(--primary); }

.main {
  flex: 1;
  display: grid;
  place-items: center;
  padding: 56px 20px 70px;
}
.box { width: 100%; max-width: 660px; }

.code {
  font-family: var(--font-display);
  font-size: clamp(64px, 14vw, 104px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -.02em;
  color: var(--primary);
  opacity: .16;
  font-variant-numeric: tabular-nums;
}
h1 { margin: -14px 0 10px; font-size: clamp(23px, 3.6vw, 31px); font-weight: 700; line-height: 1.35; }
.lead { margin: 0 0 6px; font-size: 14.5px; line-height: 1.85; color: var(--muted); max-width: 500px; }
.lead b { color: var(--ink); font-weight: 600; }
.hint {
  margin: 14px 0 0;
  padding: 11px 14px;
  border-radius: 11px;
  background: var(--glass-2);
  border: 1px solid var(--stroke);
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--faint);
  overflow-wrap: anywhere;
}

.links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
@media (max-width: 520px) { .links { grid-template-columns: 1fr; } }
.link {
  display: flex; align-items: center; gap: 11px;
  padding: 14px 16px;
  border-radius: 13px;
  background: var(--glass-2);
  border: 1px solid var(--stroke);
  box-shadow: var(--shadow);
  transition: transform .16s ease, border-color .16s ease;
}
.link:hover { transform: translateY(-2px); border-color: var(--primary); }
.link .ic { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--primary-soft); color: var(--primary); }
.link .ic svg { width: 16px; height: 16px; }
.link .tx b { display: block; font-size: 13.5px; font-weight: 600; }
.link .tx span { display: block; font-size: 11.5px; color: var(--faint); }

.home {
  display: inline-flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 22px;
  margin-top: 22px;
  border-radius: 999px;
  background: var(--primary);
  color: #fff;
  font-size: 14.5px;
  box-shadow: 0 10px 24px rgba(43, 123, 243, .26);
}
.home svg { width: 15px; height: 15px; }

.foot { padding: 0 20px 40px; text-align: center; font-size: 12px; color: var(--faint); }
.foot a { color: var(--primary); }
</style>
</head>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem("codeleap-theme"); } catch (e) {}
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("codeleap-theme", next); } catch (e) {}
  });

  var el = document.getElementById("reqPath");
  if (el) {
    var raw = "";
    try { raw = decodeURIComponent(location.pathname + location.search + location.hash).slice(-96); } catch (e) {}
    el.textContent = "请求地址：" + (raw || "—");
  }
})();
</script>
